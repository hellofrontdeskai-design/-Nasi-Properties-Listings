<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nasi Properties — Front Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500;1,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #211D18;
    --ink-soft: #4A443B;
    --paper: #FAF7F1;
    --paper-dim: #F1ECE1;
    --gold: #A9822F;
    --gold-soft: #C9A961;
    --line: #E7E0D3;
    --available: #3F7A5A;
    --available-bg: #E9F1EC;
  }

  * { box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: #EAE4D6;
    margin: 0;
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }

  #widget {
    width: 100%;
    max-width: 420px;
    height: 100vh;
    max-height: 800px;
    margin: auto;
    background: var(--paper);
    display: flex;
    flex-direction: column;
    box-shadow: 0 24px 70px rgba(33, 29, 24, 0.22);
    border-radius: 16px;
    overflow: hidden;
  }

  /* ---------- Header ---------- */
  #header {
    background: var(--paper);
    border-bottom: 1px solid var(--line);
    padding: 18px 20px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  #avatar {
    width: 38px; height: 38px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--gold-soft), var(--gold));
    display: flex; align-items: center; justify-content: center;
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 600;
    font-size: 15px;
    color: var(--paper);
    flex-shrink: 0;
  }

  #agency-name {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 600;
    font-size: 17px;
    color: var(--ink);
    margin: 0;
    line-height: 1.2;
  }

  #agency-sub {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 3px;
    font-size: 11.5px;
    color: var(--ink-soft);
    letter-spacing: 0.01em;
  }

  .live-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--available);
    box-shadow: 0 0 0 3px var(--available-bg);
    flex-shrink: 0;
  }

  /* ---------- Messages ---------- */
  #messages {
    flex: 1;
    padding: 20px 16px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    background: var(--paper);
  }

  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .row.bot { justify-content: flex-start; }

  .bubble {
    max-width: 84%;
    padding: 11px 15px;
    font-size: 14px;
    line-height: 1.55;
    animation: rise 0.28s ease-out;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .bot .bubble {
    background: #fff;
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 4px 14px 14px 14px;
  }

  .user .bubble {
    background: var(--ink);
    color: var(--paper);
    border-radius: 14px 4px 14px 14px;
  }

  /* ---------- Listing card (mirrors nasiproperties.com featured cards) ---------- */
  .listing-card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    max-width: 86%;
    box-shadow: 0 6px 18px rgba(33, 29, 24, 0.08);
  }

  .listing-media { position: relative; width: 100%; aspect-ratio: 4/3; background: var(--paper-dim); }
  .listing-media img, .listing-media video {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }

  .listing-tag {
    position: absolute; top: 10px; left: 10px;
    background: var(--ink);
    color: var(--paper);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px; letter-spacing: 0.04em; text-transform: uppercase;
    padding: 4px 9px;
    border-radius: 20px;
  }

  .listing-body { padding: 13px 14px 14px; }
  .listing-location {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px; color: var(--ink-soft);
    letter-spacing: 0.02em;
    margin-bottom: 4px;
  }
  .listing-title {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 15.5px;
    color: var(--ink);
    margin-bottom: 6px;
    line-height: 1.3;
  }
  .listing-price {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 500;
    font-size: 13.5px;
    color: var(--gold);
  }
  .listing-caption {
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-top: 6px;
    line-height: 1.5;
  }

  /* ---------- Typing indicator ---------- */
  .typing-row { display: flex; align-items: center; gap: 8px; padding: 4px 4px; }
  .key-icon { width: 15px; height: 15px; color: var(--gold); animation: turn-key 1.1s ease-in-out infinite; transform-origin: 65% 50%; }
  @keyframes turn-key { 0%, 100% { transform: rotate(-16deg); } 50% { transform: rotate(16deg); } }
  .typing-label { font-size: 12px; color: var(--ink-soft); font-family: 'IBM Plex Mono', monospace; }

  /* ---------- Input ---------- */
  #input-bar {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 14px;
    background: #fff;
    border-top: 1px solid var(--line);
  }

  #userInput {
    flex: 1;
    border: 1px solid var(--line);
    background: var(--paper);
    border-radius: 999px;
    padding: 11px 16px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    color: var(--ink);
    outline: none;
  }
  #userInput:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(169, 130, 47, 0.15); }

  #sendBtn {
    width: 42px; height: 42px; min-width: 42px;
    border: none; border-radius: 50%;
    background: var(--ink);
    color: var(--paper);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }
  #sendBtn:hover { opacity: 0.85; }
  #sendBtn:active { transform: scale(0.94); }

  /* ---------- Footer credit ---------- */
  #credit {
    text-align: center;
    font-size: 10px;
    letter-spacing: 0.03em;
    color: var(--ink-soft);
    padding: 9px 0 13px;
    background: #fff;
    font-family: 'IBM Plex Mono', monospace;
  }
  #credit b { color: var(--gold); font-weight: 500; }

  #messages::-webkit-scrollbar { width: 5px; }
  #messages::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

  @media (prefers-reduced-motion: reduce) {
    .bubble, .key-icon { animation: none !important; }
  }
</style>
</head>
<body>

<div id="widget">

  <div id="header">
    <div id="avatar">A</div>
    <div>
      <p id="agency-name">Nasi Properties</p>
      <div id="agency-sub">
        <span class="live-dot"></span>
        <span>Front desk &middot; usually replies instantly</span>
      </div>
    </div>
  </div>

  <div id="messages"></div>

  <div id="input-bar">
    <input id="userInput" type="text" placeholder="Ask about a listing..." />
    <button id="sendBtn" onclick="sendMessage()" aria-label="Send message">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
        <path d="M4 12L20 4L14 20L11 13L4 12Z" fill="currentColor"/>
      </svg>
    </button>
  </div>

  <div id="credit">Powered by <b>Front Desk AI</b> &middot; Alex</div>

</div>

<script>
  // ============================================================
  // 1. BACKEND — paste your deployed Apps Script Web App URL
  // ============================================================
  const AGENCY_NAME = "Nasi Properties";
  const BOT_NAME = "Alex";
  const BACKEND_URL = "https://script.google.com/macros/s/AKfycbwVpU3faNBYBWPk6F0QxyU3qePy3xI977jeY4Mlog_tkOp_ELdI8_NU8_xrtpBA4DRosw/exec";

  // ============================================================
  // 2. LISTING MEDIA — paste each listing's photo or video URL here,
  //    keyed by the exact Listing ID from your Google Sheet (L001, L002...).
  //    type: "image" or "video"
  //    tag: the short label shown on the card (e.g. "For Sale", "For Rent")
  //    Leave a listing out of this object if you don't have media for it yet
  //    — the AI will still describe it in text, just without a card.
  // ============================================================
  const LISTING_MEDIA = {
    L001: {
      type: "image",
      url: "PASTE_PHOTO_OR_VIDEO_URL_HERE",
      tag: "Land",
      title: "Chevron Drive, Lekki",
      location: "Chevron Drive, Lekki, Lagos",
      price: "₦300,000,000",
    },
    L002: {
      type: "image",
      url: "PASTE_PHOTO_OR_VIDEO_URL_HERE",
      tag: "Land",
      title: "Freedom Way, Lekki Phase 1",
      location: "Freedom Way, Lekki Phase 1, Lagos",
      price: "₦1,400,000/SQM",
    },
    L003: {
      type: "image",
      url: "PASTE_PHOTO_OR_VIDEO_URL_HERE",
      tag: "For Rent",
      title: "1-Bedroom Serviced Apartment",
      location: "Victoria Island, Lagos",
      price: "₦15,000,000/annum",
    },
    L004: {
      type: "image",
      url: "PASTE_PHOTO_OR_VIDEO_URL_HERE",
      tag: "Shortlet",
      title: "4-Bedroom Furnished Duplex",
      location: "Ologolo, Lekki, Lagos",
      price: "Call for price",
    },
    L005: {
      type: "image",
      url: "IMG-20260817-WA0007.jpg",
      tag: "For Sale",
      title: "3-Bedroom + BQ Terrace Duplex",
      location: "Igbo Efon / Ologolo, Lekki, Lagos",
      price: "₦220,000,000",
    },
  };

  document.getElementById('agency-name').textContent = AGENCY_NAME;

  const sessionId = "sess_" + Math.random().toString(36).substring(2, 12);
  const messagesEl = document.getElementById("messages");
  const inputEl = document.getElementById("userInput");

  function renderListingCard(listing) {
    const card = document.createElement("div");
    card.className = "listing-card";

    const media = document.createElement("div");
    media.className = "listing-media";
    const mediaEl = document.createElement(listing.type === "video" ? "video" : "img");
    mediaEl.src = listing.url;
    if (listing.type === "video") { mediaEl.controls = true; mediaEl.muted = true; }
    media.appendChild(mediaEl);

    const tag = document.createElement("div");
    tag.className = "listing-tag";
    tag.textContent = listing.tag;
    media.appendChild(tag);

    const body = document.createElement("div");
    body.className = "listing-body";
    body.innerHTML = `
      <div class="listing-location">${listing.location}</div>
      <div class="listing-title">${listing.title}</div>
      <div class="listing-price">${listing.price}</div>
    `;

    card.appendChild(media);
    card.appendChild(body);
    return card;
  }

  function addMessage(rawText, sender) {
    // Strip the REF:<Listing ID> marker the backend appends when a specific
    // listing is being discussed, and render a media card for it if we have one.
    let text = rawText;
    let refId = null;
    const refMatch = text.match(/REF:\s*([A-Za-z0-9]+)\s*$/);
    if (refMatch) {
      refId = refMatch[1].toUpperCase();
      text = text.replace(/REF:\s*[A-Za-z0-9]+\s*$/, "").trim();
    }

    if (text) {
      const row = document.createElement("div");
      row.className = "row " + sender;
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;
      row.appendChild(bubble);
      messagesEl.appendChild(row);
    }

    if (refId && LISTING_MEDIA[refId] && LISTING_MEDIA[refId].url && !LISTING_MEDIA[refId].url.startsWith("PASTE_")) {
      const cardRow = document.createElement("div");
      cardRow.className = "row bot";
      cardRow.appendChild(renderListingCard(LISTING_MEDIA[refId]));
      messagesEl.appendChild(cardRow);
    }

    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addTypingIndicator() {
    const row = document.createElement("div");
    row.className = "row bot";
    row.innerHTML = `
      <div class="bubble typing-row">
        <svg class="key-icon" viewBox="0 0 24 24" fill="none">
          <circle cx="8" cy="12" r="4" stroke="currentColor" stroke-width="2"/>
          <path d="M12 12H21M17 12V16M21 12V15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span class="typing-label">checking listings...</span>
      </div>`;
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return row;
  }

  async function callBackend(payload, attempt = 1) {
    const res = await fetch(BACKEND_URL, { method: "POST", body: JSON.stringify(payload) });
    const text = await res.text();
    try {
      return JSON.parse(text);
    } catch (parseErr) {
      if (attempt < 2) {
        await new Promise(r => setTimeout(r, 800));
        return callBackend(payload, attempt + 1);
      }
      throw new Error("Server returned an unexpected response, please try again.");
    }
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;
    addMessage(text, "user");
    inputEl.value = "";

    const typingRow = addTypingIndicator();

    try {
      const data = await callBackend({ sessionId, message: text });
      typingRow.remove();
      addMessage(data.reply, "bot");
    } catch (err) {
      typingRow.remove();
      addMessage("Sorry, something went wrong. Please try again in a moment.", "bot");
    }
  }

  inputEl.addEventListener("keypress", (e) => { if (e.key === "Enter") sendMessage(); });

  addMessage(`Hi, I'm ${BOT_NAME} 👋 I help with enquiries for ${AGENCY_NAME}. Tell me what you're looking for — rent, sale, land, JV, or shortlet — and I'll find the right match.`, "bot");
</script>

</body>
  </html>
